[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

# A build backend makes `uv sync` install src/{{PACKAGE_NAME}} into the venv,
# so tests can import it. Without one uv treats the project as virtual.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "{{PACKAGE_NAME}}"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "ruff>=0.16",
  "mypy>=2.0",
  "deptry>=0.25",
  "pre-commit",
  # Optional verification depth — cheap when an agent does the labor.
  # Uncomment per project once there is real logic worth the rigor:
  # "pytest-cov",       # line-coverage report: uv run pytest --cov (CI does not gate on it)
  # "diff-cover",       # gate coverage on the diff only (needs pytest-cov's coverage.xml)
  # "hypothesis",       # property-based tests; pairs well with /test-first
  # "mutmut",           # mutation testing; catches tautological test suites
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Sensible defaults that catch agent mistakes
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear (catches common mistakes)
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "ANN",           # annotations (force type hints)
  "TID",           # tidy imports
  "PTH",           # use pathlib
  "S",             # flake8-bandit security checks (tests ignore S101 below)
  "D",             # pydocstyle: docstrings on public symbols, Google style (below)
  "BLE",           # blind except: `except Exception` that swallows instead of re-raising
]
# Public modules, classes, functions, and methods need a docstring; module,
# package, magic-method, and __init__ docstrings are not required.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "D"]  # allow asserts in tests, no annotation or docstring requirement

# Dependency hygiene: imports with no declared dependency, declared
# dependencies nothing imports, and transitive packages used directly.
[tool.deptry]
known_first_party = ["{{PACKAGE_NAME}}"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
