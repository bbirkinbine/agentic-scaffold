name: CI

# CI for the scaffold repo itself. Everything here propagates by copy
# into new projects (and into existing ones via bootstrap.sh --update),
# so a broken template ships broken projects. Five jobs:
#   shell — syntax + shellcheck over bootstrap.sh and the hook scripts.
#   smoke — bootstrap every Python profile into a temp dir, assert the file
#           set, fill the day-zero placeholders, and run the full
#           quality gate through the toolchain runner. Proves "green from
#           the first run" stays true.
#   generic-smoke — bootstrap the stack-neutral flavor and exercise fresh,
#                   update, migration, hook, and config fixtures.
#   typescript-smoke — bootstrap the TypeScript flavor and run its gate,
#                      including the red-gate and Stop-hook cases.
#   custom-smoke — bootstrap the custom flavor, prove the unfilled runner
#                  keeps the gates quiet, fill it, and prove the gate and
#                  Stop hook then work and --update leaves it alone.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax-check shell scripts (bash -n)
        run: |
          bash -n scripts/*.sh
          bash -n generic/bootstrap.sh
          bash -n shared/hooks/*.sh workflow/hooks/*.sh
          bash -n stacks/*/toolchain.sh stacks/*/stack.sh
          bash -n python/bootstrap.sh typescript/bootstrap.sh custom/bootstrap.sh

      # --severity=warning: the info-level SC2016 hits are intentional
      # single-quoted regex patterns in the hook scripts.
      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/*.sh \
            generic/bootstrap.sh \
            shared/hooks/*.sh \
            workflow/hooks/*.sh \
            stacks/*/toolchain.sh \
            stacks/*/stack.sh \
            python/bootstrap.sh \
            typescript/bootstrap.sh \
            custom/bootstrap.sh

      # Client validation must not silently disappear on a runner that lacks
      # Codex or Pi. Keep these versions aligned with the portability docs.
      - name: Install pinned client validation baselines
        run: |
          npm install --global @openai/codex@0.146.0 @earendil-works/pi-coding-agent@1.0.4
          test "$(codex --version)" = "codex-cli 0.146.0"
          test "$(pi --version)" = "1.0.4"

      - name: Validate shared sources and client adapters
        run: |
          bash scripts/validate-codex-adapters.sh
          bash scripts/validate-pi-adapters.sh

  generic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap generic projects and exercise migration
        run: bash scripts/smoke-test-generic.sh

  custom-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap a custom-stack project, fill its runner, run its gate
        run: bash scripts/smoke-test-custom.sh

  typescript-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - strict: ""
          - strict: --strict-hooks
    name: typescript-smoke (${{ matrix.strict || 'default' }})
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bootstrap a TypeScript project and run its quality gate
        run: bash scripts/smoke-test-typescript.sh ${{ matrix.strict }}

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimal
          - profile: core
          - profile: full
          - profile: core
            strict: --strict-hooks
          - profile: core
            strict: --no-stop-gate
    name: smoke (${{ matrix.profile }}${{ matrix.strict && format(' {0}', matrix.strict) || '' }})
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Bootstrap a project and run its quality gate
        run: bash scripts/smoke-test.sh ${{ matrix.profile }} ${{ matrix.strict || '' }}
